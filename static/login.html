<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Sowmax Scanner</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237c5cff'/%3E%3Cstop offset='1' stop-color='%2300d4aa'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Cpath d='M7 21l6-7 4 4 8-9' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <script>
    try { var t = localStorage.getItem("theme"); } catch (e) {}
    document.documentElement.dataset.theme = t || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  </script>
  <style>
    .login-wrap { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
    .login-card { width: 100%; max-width: 380px; background: var(--panel); border: 1px solid var(--line);
      border-radius: 20px; padding: 32px 28px; box-shadow: var(--shadow-lg); backdrop-filter: blur(14px); }
    .login-card .brand { justify-content: center; margin-bottom: 6px; }
    .login-card h1 { font-size: 20px; font-weight: 700; text-align: center; margin: 18px 0 4px; letter-spacing: -.01em; }
    .login-card .sub { text-align: center; color: var(--muted); font-size: 14px; margin: 0 0 22px; }
    .login-card label { display: block; font-size: 13px; font-weight: 600; color: var(--text-2); margin: 14px 0 6px; }
    .login-card input { width: 100%; box-sizing: border-box; padding: 11px 13px; font: inherit; font-size: 15px;
      color: var(--text); background: var(--panel-2); border: 1px solid var(--line); border-radius: 11px; outline: none; }
    .login-card input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(124, 92, 255, .2); }
    .login-card button { width: 100%; margin-top: 22px; padding: 12px; font: inherit; font-size: 15px; font-weight: 700;
      color: #fff; background: var(--brand-grad); border: 0; border-radius: 11px; cursor: pointer; }
    .login-card button:hover { filter: brightness(1.06); }
    .login-card .err { margin: 0 0 6px; padding: 10px 12px; font-size: 13.5px; color: var(--down);
      background: var(--down-bg); border: 1px solid var(--down-line); border-radius: 10px; }
  </style>
</head>
<body>
  <div class="glow g1"></div><div class="glow g2"></div>
  <main class="login-wrap">
    <form class="login-card" method="post" action="/login">
      <div class="brand">
        <span class="logo">
          <svg viewBox="0 0 24 24" width="18" height="18"><path d="M4 16l5-6 4 4 7-8" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        <span class="brand-t">Sowmax <em>Scanner</em></span>
      </div>
      <h1>Sign in</h1>
      <p class="sub">Enter your user ID and password to continue.</p>
      {{error}}
      <input type="hidden" name="next" value="{{next}}">
      <label for="username">User ID</label>
      <input id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Sign in</button>
    </form>
  </main>
</body>
</html>
